pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,mjs,ts,json,jsonc,yml}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
    reuse:
      run: reuse lint
commit-msg:
  commands:
    "lint commit message":
      run: bunx commitlint --edit {1}
pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun test

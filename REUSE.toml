version = 1
SPDX-PackageName = "ausculto"
SPDX-PackageSupplier = "https://github.com/cod3ddot/ausculto"

# configs
[[annotations]]
path = [
    ".gitignore",
    ".gitattributes",
    ".vscode/**/*",
    ".zed/**/*",
    "bun.lock",
    "package.json",
    "tsconfig.json",
    "biome.jsonc",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 cod3ddot@proton.me"
SPDX-License-Identifier = "CC0-1.0"

# documentation
[[annotations]]
path = ["README.md", "CHANGES.md", "docs/**/*"]
SPDX-FileCopyrightText = "2026 cod3ddot@proton.me"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"
